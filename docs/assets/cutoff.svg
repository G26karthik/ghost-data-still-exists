<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img" aria-label="Timeline showing which readbacks count against the audit cutoff" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
<rect width="940" height="340" rx="14" fill="#0b1017"/>
<text x="30" y="40" font-size="17" fill="#e6edf3" font-weight="700" text-anchor="start">State is judged at audit_at, not at the latest snapshot</text>
<text x="30" y="62" font-size="13" fill="#8da2b8" font-weight="400" text-anchor="start">A readback counts only if it was captured and recorded at or before the cutoff.</text>
<line x1="50" y1="215" x2="890" y2="215" stroke="#2a3a4d" stroke-width="2"/>
<rect x="601.2" y="86" width="288.79999999999995" height="189" fill="#ffffff" opacity=".035"/>
<line x1="601.2" y1="82" x2="601.2" y2="277" stroke="#f2b441" stroke-width="2" stroke-dasharray="6 4"/>
<text x="601.2" y="78" font-size="13" fill="#f2b441" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">audit_at</text>
<text x="613.2" y="267" font-size="12" fill="#8da2b8" font-weight="400" text-anchor="start">after the cutoff: ignored, with its citation</text>
<circle cx="92.8" cy="215" r="5" fill="#8da2b8"/>
<text x="92.8" y="243" font-size="12" fill="#8da2b8" font-weight="500" text-anchor="middle">requested</text>
<circle cx="240.4" cy="215" r="5" fill="#8da2b8"/>
<text x="240.4" y="243" font-size="12" fill="#8da2b8" font-weight="500" text-anchor="middle">worker: SUCCESS</text>
<circle cx="314.2" cy="215" r="5" fill="#8da2b8"/>
<text x="314.2" y="265" font-size="12" fill="#8da2b8" font-weight="500" text-anchor="middle">dashboard: Complete</text>
<line x1="412.6" y1="130" x2="412.6" y2="209" stroke="#3fb68b" stroke-width="1.5" opacity=".7"/>
<circle cx="412.6" cy="215" r="6" fill="#3fb68b"/>
<rect x="336.6" y="92" width="152" height="40" rx="7" fill="#111a24" stroke="#3fb68b"/>
<text x="412.6" y="108" font-size="12.5" fill="#e6edf3" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">primary: NOT_FOUND</text>
<text x="412.6" y="124" font-size="11" fill="#3fb68b" font-weight="600" text-anchor="middle">counts</text>
<line x1="511.00000000000006" y1="200" x2="511.00000000000006" y2="209" stroke="#ff6b6b" stroke-width="1.5" opacity=".7"/>
<circle cx="511.00000000000006" cy="215" r="6" fill="#ff6b6b"/>
<rect x="435.00000000000006" y="162" width="152" height="40" rx="7" fill="#111a24" stroke="#ff6b6b"/>
<text x="511.00000000000006" y="178" font-size="12.5" fill="#e6edf3" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">read replica: FOUND</text>
<text x="511.00000000000006" y="194" font-size="11" fill="#ff6b6b" font-weight="600" text-anchor="middle">counts: still present, a finding</text>
<line x1="748.8" y1="138" x2="748.8" y2="209" stroke="#51606f" stroke-width="1.5" opacity=".7"/>
<circle cx="748.8" cy="215" r="6" fill="#51606f"/>
<rect x="672.8" y="100" width="152" height="40" rx="7" fill="#111a24" stroke="#51606f"/>
<text x="748.8" y="116" font-size="12.5" fill="#e6edf3" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">later snapshot: NOT_FOUND</text>
<text x="748.8" y="132" font-size="11" fill="#51606f" font-weight="600" text-anchor="middle">excluded</text>
<text x="30" y="318" font-size="13" fill="#e6edf3" font-weight="500" text-anchor="start">Result for this case: INCOMPLETE. The replica copy is reported, deleted, and checked absent afterwards.</text>
</svg>
